<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Examen</title>
    
    <script>
      window.MathJax = {
        tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
      };
    </script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        
        /* Estilo del Timer */
        #timer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #2c3e50;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 1000;
            display: none; /* Se mantiene oculto hasta empezar el examen */
        }

        /* Estilos de la pantalla de inicio */
        .config-buttons { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .config-buttons button { background-color: #2c3e50; border-radius: 8px; font-weight: bold; }
        .config-buttons button:hover { background-color: #1a252f; transform: scale(1.02); }
        
        .section-header { background-color: #3498db; color: white; padding: 10px 15px; margin: 30px 0 15px 0; border-radius: 4px; font-size: 1.2em; }
        .question-block { margin-bottom: 25px; padding: 15px; background: #f9f9f9; border-left: 5px solid #3498db; border-radius: 4px; transition: background 0.3s; }
        .question-title { font-weight: bold; margin-bottom: 15px; font-size: 1.1em; }
        .options label { display: block; margin-bottom: 10px; cursor: pointer; padding: 10px; border-radius: 4px; transition: background 0.3s; }
        .options label:hover { background: #eef2f5; }
        .options input:disabled { cursor: not-allowed; }
        .options label.disabled { color: #888; cursor: not-allowed; }
        
        .feedback { margin-top: 10px; font-weight: normal; padding: 15px; border-radius: 4px; display: none; }
        .feedback.correct { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .feedback.incorrect { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .feedback strong { font-weight: bold; }

        button { display: block; width: 100%; padding: 15px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 1.2em; cursor: pointer; margin-top: 20px; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        #result-container { display: none; margin-top: 30px; text-align: center; padding: 20px; background: #e8f8f5; border-radius: 8px; border: 2px solid #1abc9c; }
        .error-box { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 15px; border-radius: 4px; }
        .grade { font-size: 2em; font-weight: bold; color: #1abc9c; }
    </style>
</head>
<body>

<div id="timer">Tiempo: 00:00</div>

<div class="container" id="start-screen">
    <h1 id="start-title">Simulador de Examen</h1>
    <p id="start-description" style="text-align: center; font-size: 1.1em;"></p>
    <div class="config-buttons" id="config-buttons"></div>
</div>

<div class="container" id="exam-screen" style="display: none;">
    <h1 id="exam-title">Examen</h1>
    <p>Selecciona una respuesta para ver la retroalimentación inmediata.</p>
    <form id="quiz-form">
        <div id="questions-container"></div>
        <button type="button" onclick="calculateGrade()">Ver Calificación Final</button>
    </form>
    <div id="result-container">
        <h2>Resultados Globales</h2>
        <p>Tu calificación final es:</p>
        <p class="grade" id="final-grade"></p>
        <p id="total-time" style="font-size: 1.2em; font-weight: bold; color: #2c3e50;"></p>
        <p id="feedback-message"></p>
        <button type="button" onclick="location.reload()" style="background-color: #2c3e50;">Reiniciar Simulador</button>
    </div>
</div>

<!-- Banco de preguntas: cambia este archivo para usar otro material -->
<script src="questions.js"></script>

<script>
    let currentExamQuestions = [];
    // Clave de respuestas DESPUÉS de barajar las opciones (índice global -> opción correcta)
    let answerKey = [];

    // Variables globales para el temporizador
    let seconds = 0;
    let timerInterval = null;

    // ---------- Configuración inicial a partir de questions.js ----------
    function initStartScreen() {
        const startScreen = document.getElementById('start-screen');

        if (typeof EXAM_CONFIG === 'undefined' || !Array.isArray(EXAM_CONFIG.secciones) || EXAM_CONFIG.secciones.length === 0) {
            startScreen.innerHTML = '<h1>Simulador de Examen</h1>' +
                '<div class="error-box"><strong>No se encontró el banco de preguntas.</strong><br>' +
                'Verifica que el archivo <code>questions.js</code> esté en la misma carpeta que este index.html ' +
                'y que defina <code>EXAM_CONFIG</code> correctamente (revisa la consola del navegador para ver errores de sintaxis).</div>';
            return;
        }

        validateQuestions();

        if (EXAM_CONFIG.tituloPagina) document.title = EXAM_CONFIG.tituloPagina;
        document.getElementById('start-title').innerText = EXAM_CONFIG.tituloInicio || 'Simulador de Examen';
        document.getElementById('exam-title').innerText = EXAM_CONFIG.tituloExamen || EXAM_CONFIG.tituloInicio || 'Examen';
        document.getElementById('start-description').innerText = EXAM_CONFIG.descripcion || '';

        const numSecciones = EXAM_CONFIG.secciones.length;
        const tamanos = (Array.isArray(EXAM_CONFIG.tamanos) && EXAM_CONFIG.tamanos.length)
            ? EXAM_CONFIG.tamanos
            : [{ etiqueta: 'Examen Completo', porSeccion: 'todas' }];

        const buttonsDiv = document.getElementById('config-buttons');
        tamanos.forEach(t => {
            // Total real: si una sección tiene menos preguntas que las pedidas, se usan todas las que tenga
            const total = EXAM_CONFIG.secciones.reduce((sum, sec) =>
                sum + (t.porSeccion === 'todas' ? sec.preguntas.length : Math.min(t.porSeccion, sec.preguntas.length)), 0);

            let detalle;
            if (t.porSeccion === 'todas') detalle = `Todas las preguntas - ${total} Total`;
            else if (numSecciones === 1) detalle = `${total} preguntas`;
            else detalle = `${t.porSeccion} preguntas por sección - ${total} Total`;

            const btn = document.createElement('button');
            btn.type = 'button';
            btn.innerText = `${t.etiqueta} (${detalle})`;
            btn.addEventListener('click', () => startExam(t.porSeccion));
            buttonsDiv.appendChild(btn);
        });
    }

    // Revisa errores comunes en el banco de preguntas y los reporta en la consola
    function validateQuestions() {
        EXAM_CONFIG.secciones.forEach((sec, s) => {
            (sec.preguntas || []).forEach((p, i) => {
                const donde = `Sección ${s + 1} ("${sec.titulo}"), pregunta ${i + 1}`;
                if (!p.q) console.warn(`${donde}: falta el texto "q".`);
                if (!Array.isArray(p.options) || p.options.length < 2) console.warn(`${donde}: "options" debe tener al menos 2 opciones.`);
                else if (!(Number.isInteger(p.respuestaCorrecta) && p.respuestaCorrecta >= 0 && p.respuestaCorrecta < p.options.length))
                    console.warn(`${donde}: "respuestaCorrecta" (${p.respuestaCorrecta}) no corresponde a ninguna opción.`);
            });
        });
    }

    // Función para obtener preguntas aleatorias con barajado forzado
    function getRandom(arr, n) {
        let shuffled = [...arr];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return (n === 'todas' || n >= arr.length) ? shuffled : shuffled.slice(0, n);
    }

    // Función que arranca el examen dependiendo la cantidad deseada por sección
    function startExam(n) {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('exam-screen').style.display = 'block';

        // Lógica del Temporizador (Iniciar)
        document.getElementById('timer').style.display = 'block';
        seconds = 0;
        document.getElementById('timer').innerText = `Tiempo: 00:00`;
        timerInterval = setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `Tiempo: ${mins}:${secs}`;
        }, 1000);

        // Seleccionar N preguntas al azar de cada sección definida en questions.js
        currentExamQuestions = EXAM_CONFIG.secciones.map(sec => ({
            titulo: sec.titulo,
            preguntas: getRandom(sec.preguntas || [], n)
        }));

        renderExam();
    }

    // Renderizar el examen en el HTML
    function renderExam() {
        const container = document.getElementById('questions-container');
        container.innerHTML = ''; // Limpiar si había algo previo
        answerKey = []; // Reiniciar la clave de respuestas
        
        let globalIndex = 0; // Índice único para cada radio button de todo el examen

        currentExamQuestions.forEach((seccion) => {
            // Título de la Sección
            const header = document.createElement('div');
            header.className = 'section-header';
            header.innerText = seccion.titulo;
            container.appendChild(header);

            seccion.preguntas.forEach((preguntaOriginal) => {
                // Clonamos la pregunta para no alterar la base de datos principal
                const pregunta = JSON.parse(JSON.stringify(preguntaOriginal));

                // Limpiar texto de "A)" para barajar bien
                pregunta.options = pregunta.options.map(opt => opt.replace(/^[A-D]\)\s*/, ''));
                const textoCorrectoOriginal = pregunta.options[pregunta.respuestaCorrecta];

                // Barajar opciones
                for (let i = pregunta.options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [pregunta.options[i], pregunta.options[j]] = [pregunta.options[j], pregunta.options[i]];
                }
                pregunta.respuestaCorrecta = pregunta.options.indexOf(textoCorrectoOriginal);
                // Guardar la respuesta correcta según el orden barajado que ve el usuario
                answerKey[globalIndex] = pregunta.respuestaCorrecta;

                const questionBlock = document.createElement('div');
                questionBlock.className = 'question-block';

                const title = document.createElement('div');
                title.className = 'question-title';
                const cleanTitle = pregunta.q.replace(/\s*\]+\]/g, '');
                // Modificamos el título para que tenga un número secuencial nuevo
                title.innerText = `${globalIndex + 1}. ` + cleanTitle.replace(/^Reactivo \d+\.?\s*/, '');
                questionBlock.appendChild(title);

                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'options';

                const feedbackDiv = document.createElement('div');
                feedbackDiv.className = 'feedback';
                feedbackDiv.id = 'feedback-' + globalIndex;

                pregunta.options.forEach((opcion, optIndex) => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = 'q' + globalIndex; // Usar el índice global para que no haya conflicto
                    radio.value = optIndex;
                    
                    radio.addEventListener('change', function() {
                        feedbackDiv.style.display = 'block';
                        
                        const allRadios = document.getElementsByName('q' + this.name.substring(1));
                        allRadios.forEach(r => {
                            r.disabled = true;
                            r.parentElement.classList.add('disabled');
                        });

                        if (parseInt(this.value) === pregunta.respuestaCorrecta) {
                            feedbackDiv.className = 'feedback correct';
                            feedbackDiv.innerHTML = '<strong>¡Correcto!</strong><br><br><strong>Justificación:</strong> ' + pregunta.justificacion;
                        } else {
                            feedbackDiv.className = 'feedback incorrect';
                            const letraCorrecta = String.fromCharCode(65 + pregunta.respuestaCorrecta);
                            feedbackDiv.innerHTML = '<strong>Incorrecto.</strong> La respuesta correcta era la opción <strong>' + letraCorrecta + '</strong>.<br><br><strong>Justificación:</strong> ' + pregunta.justificacion;
                        }
                        
                        if (window.MathJax) {
                            MathJax.typesetPromise([feedbackDiv]).catch((err) => console.log('MathJax error: ', err));
                        }
                    });

                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(' ' + String.fromCharCode(65 + optIndex) + ') ' + opcion));
                    optionsDiv.appendChild(label);
                });

                questionBlock.appendChild(optionsDiv);
                questionBlock.appendChild(feedbackDiv);
                container.appendChild(questionBlock);
                globalIndex++;
            });
        });

        // Forzar a MathJax a procesar las preguntas inyectadas
        if (window.MathJax) {
            MathJax.typesetPromise([container]).catch((err) => console.log('MathJax error: ', err));
        }
    }

    // Calcular la calificación final
    function calculateGrade() {
        // Detener el cronómetro al calificar
        clearInterval(timerInterval);

        let score = 0;
        let answered = 0;
        let totalQuestions = 0;

        // Calcular cuántas preguntas hay en total en el examen actual
        currentExamQuestions.forEach(sec => totalQuestions += sec.preguntas.length);

        for(let i = 0; i < totalQuestions; i++){
            const selected = document.querySelector(`input[name="q${i}"]:checked`);
            if (selected) {
                answered++;
                // Comparar contra la clave barajada, no contra el banco original
                if (parseInt(selected.value) === answerKey[i]) {
                    score++;
                }
            }
        }

        const percentage = (score / totalQuestions) * 100;
        document.getElementById('final-grade').innerText = `${score} / ${totalQuestions} (${percentage.toFixed(1)}%)`;
        
        // Mostrar el tiempo formateado
        const finalMins = Math.floor(seconds / 60);
        const finalSecs = (seconds % 60).toString().padStart(2, '0');
        document.getElementById('total-time').innerText = `Tiempo total empleado: ${finalMins} minutos y ${finalSecs} segundos.`;
        
        let feedback = "";
        if(percentage >= 90) feedback = "¡Excelente trabajo! Tienes un dominio sobresaliente.";
        else if(percentage >= 70) feedback = "Buen resultado, pero sigue puliendo tus áreas débiles.";
        else feedback = "Necesitas seguir estudiando intensamente para mejorar este puntaje.";
        
        document.getElementById('feedback-message').innerText = feedback;
        document.getElementById('result-container').style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }

    initStartScreen();
</script>

<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

</body>
</html>
